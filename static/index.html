<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <p class="eyebrow">Applications</p>
        <h1>Job tracker</h1>
        <p class="lede">Save roles from Indeed and keep their status in one list.</p>
      </div>
      <button type="button" class="primary" data-action="new">New listing</button>
    </header>

    <div class="toolbar">
      <div class="filters" id="filters"></div>
      <p class="count" id="count"></p>
    </div>

    <main id="board"></main>
    <p class="storage">Stored locally in data/jobs.json</p>
  </div>

  <dialog id="listing-dialog" aria-labelledby="dialog-title">
    <form id="listing-form">
      <div class="dialog-head">
        <div>
          <p class="eyebrow" id="dialog-kicker">New listing</p>
          <h2 id="dialog-title">Paste an Indeed link</h2>
        </div>
        <button type="button" class="icon-btn" id="close-dialog" aria-label="Close">×</button>
      </div>

      <div class="link-panel">
        <label for="job-url">Indeed job link</label>
        <div class="link-row">
          <input
            id="job-url"
            name="job_url"
            type="text"
            inputmode="url"
            placeholder="https://www.indeed.com/jobs?…&amp;vjk=…"
            autocomplete="off"
            spellcheck="false"
            required
          />
          <button type="button" class="ghost" id="lookup-btn">Look up</button>
        </div>
        <p id="lookup-msg" class="hint" role="status"></p>
      </div>

      <div class="field">
        <label for="title">Title</label>
        <input id="title" name="title" maxlength="140" required />
      </div>

      <div class="split">
        <div class="field">
          <label for="company">Company</label>
          <input id="company" name="company" maxlength="140" />
        </div>
        <div class="field">
          <label for="location">Location</label>
          <input id="location" name="location" maxlength="140" />
        </div>
      </div>

      <div class="field status-field">
        <label for="status">Status</label>
        <select id="status" name="status"></select>
      </div>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="4" maxlength="4000" placeholder="Recruiter, stack, follow-up date…"></textarea>
      </div>

      <div class="actions">
        <button type="button" class="text-danger" id="delete-btn" hidden>Delete</button>
        <span class="grow"></span>
        <button type="button" class="ghost" id="cancel-btn">Cancel</button>
        <button type="submit" class="primary" id="save-btn">Add listing</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
